name: CI

on: [push]

permissions:
  contents: read

jobs:

  test:

    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: $/
        with:
          version: v0.12.6

      - name: Get nvim location
        run: which nvim

      - name: Get nvim version
        run: nvim --version

      - name: Get runtime directory
        run: echo "$VIMRUNTIME"
