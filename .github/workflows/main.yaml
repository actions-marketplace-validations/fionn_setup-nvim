name: CI

on: [push]

permissions:
  contents: read

jobs:

  test-x86:

    name: Test on x86
    runs-on: ubuntu-26.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: $/
        with:
          version: v0.12.6

      - name: Get nvim location
        run: which nvim

      - name: Get nvim version
        run: nvim --version

      - name: Get runtime directory
        run: echo "$VIMRUNTIME"

  test-arm:

    name: Test on ARM
    runs-on: ubuntu-26.04-arm

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: $/
        with:
          version: v0.12.6

      - name: Get nvim location
        run: which nvim

      - name: Get nvim version
        run: nvim --version

      - name: Get runtime directory
        run: echo "$VIMRUNTIME"
